<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coral-Net | Acceso Seguro</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Orbitron', sans-serif;
            background-color: #050b14;
            color: #c7d2fe;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-box {
            background: rgba(10, 20, 35, 0.9);
            padding: 40px;
            border-radius: 12px;
            border: 1px solid rgba(0, 243, 255, 0.3);
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.15);
            width: 340px;
            text-align: center;
        }
        h2 { color: #00f3ff; letter-spacing: 2px; margin-bottom: 25px; }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #00f3ff;
            border-radius: 6px;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: rgba(0, 243, 255, 0.15);
            border: 1px solid #00f3ff;
            color: #00f3ff;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover { background: #00f3ff; color: #050b14; box-shadow: 0 0 15px #00f3ff; }
        .error { color: #ff0033; font-size: 0.85em; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>[ CORAL-NET LOGIN ]</h2>
        <form method="post" action="/login">
            <input type="text" name="username" placeholder="USUARIO" required autocomplete="username">
            <input type="password" name="password" placeholder="CONTRASEÑA" required autocomplete="current-password">
            <button type="submit">INICIAR SESIÓN</button>
        </form>
    </div>
    <script>
        if (new URLSearchParams(window.location.search).get('error') === '1') {
            document.body.insertAdjacentHTML('beforeend', '<p style="color:#ff0033; text-align:center;">Credenciales inválidas</p>');
        }
    </script>
</body>
</html>
